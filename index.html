<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7ed">
    <title>春青手搖飲｜班級一起點</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js?v=20261019-1"></script>
    <script src="menu.js" defer></script>
    <script src="api.js" defer></script>
    <script src="order.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="春青手搖飲首頁">
        <span class="brand-mark" aria-hidden="true">春</span>
        <span>春青手搖飲<small>CLASS TEA TIME</small></span>
      </a>
      <nav aria-label="主要導覽">
        <a class="nav-link nav-link-active" href="index.html" aria-current="page">我要點餐</a>
        <a class="nav-link" href="orders.html">目前訂單</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="menu-panel panel" aria-labelledby="menu-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">TAKE A LITTLE BREAK</p>
            <h1 id="menu-heading">今天想喝什麼？</h1>
          </div>
          <span class="heading-note">完整菜單 · 依圖片等比例呈現</span>
        </div>
        <img class="menu-image" src="menu.jpg" alt="手搖飲完整菜單，包含飲品、尺寸價格與加料選項">
      </section>

      <div class="order-layout">
        <section class="form-panel panel" aria-labelledby="order-heading">
          <div class="section-heading compact-heading">
            <div>
              <p class="eyebrow">MAKE IT YOURS</p>
              <h2 id="order-heading">填寫點餐內容</h2>
            </div>
            <span class="step-badge">1 — 2</span>
          </div>

          <form id="order-form">
            <label class="field-label" for="customer-name">怎麼稱呼你？<span class="required-mark">必填</span></label>
            <input id="customer-name" name="name" type="text" maxlength="40" placeholder="輸入姓名，方便取飲料" autocomplete="name" required>

            <label class="field-label" for="drink-choice">挑一杯喜歡的</label>
            <select id="drink-choice" name="drinkId" required></select>

            <fieldset class="choice-fieldset">
              <legend class="field-label">杯子尺寸</legend>
              <div class="choice-row" id="size-choices">
                <label class="choice-card">
                  <input type="radio" name="size" value="M" checked>
                  <span><strong>M</strong><small>中杯</small></span>
                </label>
                <label class="choice-card">
                  <input type="radio" name="size" value="L">
                  <span><strong>L</strong><small>大杯</small></span>
                </label>
              </div>
            </fieldset>

            <div class="field-grid">
              <div>
                <label class="field-label" for="sugar-choice">甜度</label>
                <select id="sugar-choice" name="sugar">
                  <option>正常糖</option>
                  <option>少糖</option>
                  <option>半糖</option>
                  <option>微糖</option>
                  <option>一分糖</option>
                  <option>無糖</option>
                </select>
              </div>
              <div>
                <label class="field-label" for="ice-choice">冰量</label>
                <select id="ice-choice" name="ice">
                  <option>正常冰</option>
                  <option>少冰</option>
                  <option>微冰</option>
                  <option>去冰</option>
                  <option>溫飲</option>
                  <option>熱飲</option>
                </select>
              </div>
            </div>

            <fieldset class="choice-fieldset toppings-fieldset">
              <legend class="field-label">想加點配料嗎？</legend>
              <div id="topping-choices" class="topping-list"></div>
            </fieldset>

            <div class="field-grid quantity-row">
              <label class="field-label" for="quantity">杯數
                <input id="quantity" name="quantity" type="number" min="1" max="20" step="1" value="1" required>
              </label>
              <p class="order-hint">每個品項請分開送出，方便統計同學的選擇。</p>
            </div>

            <button class="submit-button" type="submit">送出這杯訂單 <span aria-hidden="true">→</span></button>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          </form>
        </section>

        <aside class="price-panel panel" aria-labelledby="price-heading">
          <div class="section-heading compact-heading">
            <div>
              <p class="eyebrow">YOUR TOTAL</p>
              <h2 id="price-heading">這杯的價格</h2>
            </div>
            <span class="price-icon" aria-hidden="true">＄</span>
          </div>
          <p class="price-caption">依照飲品、尺寸與配料即時試算</p>
          <p class="total-price" aria-live="polite"><span id="total-price">NT$ 35</span><small>新台幣</small></p>
          <dl id="price-breakdown" class="price-breakdown"></dl>
          <div class="price-divider"></div>
          <p class="price-footnote">送出訂單時會一併記錄試算金額；果茶甜度依菜單建議調整。</p>
          <a class="text-link" href="orders.html">查看全班目前訂單 <span aria-hidden="true">→</span></a>
        </aside>
      </div>
    </main>

    <footer class="site-footer">一杯好茶，讓上課日常多一點甜。<span>春青手搖飲 · 班級團購</span></footer>
  </body>
</html>
